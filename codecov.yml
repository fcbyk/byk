# Codecov 判定规则。
#
# 采用 Codecov 官方文档的推荐形态：两个 status 的 target 都用 auto，
# 只额外给 threshold 留一点容差。主流开源项目基本都是这个形状——
# 硬编码 80% / 100% 的门槛，在有历史欠账的仓库上会频繁误伤。
#
# auto 的含义是「和 base 提交比」：PR 比目标分支，push 比父提交。
# 它算不上绝对的 ratchet（基准会跟着你的历史水平走），但足以挡住
# 「新代码完全不写测试」这类退化。

coverage:
  status:
    project:
      default:
        target: auto
        # 整体覆盖率允许跌 1%，避免统计噪声把 PR 标红。
        threshold: 1%
    patch:
      default:
        target: auto
        # 改动行允许比基准低 5%：单个分支没测到不该卡住整个 PR。
        threshold: 5%

# 这两个文件只由 e2e（Python 驱动真实二进制）验证，cargo test 碰不到，
# 覆盖率恒为 0。留在统计里会让任何改动它们的 PR 的 patch 覆盖率失真。
ignore:
  - 'src/main.rs'
  - 'src/core/api.rs'

# diff：本次改动逐行覆盖；files：受影响文件的覆盖率变化。
# require_changes 让覆盖率没动时不发评论，减少噪音。
comment:
  layout: 'diff, files'
  require_changes: true
