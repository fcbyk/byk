# 构建发布产物。两种模式共用同一个构建矩阵，靠 event_name 分叉：
#
#   push tag v*  →  5 个 tar/zip，生成校验和，创建 draft release
#   手动触发      →  同样 5 个 tar/zip，不碰 release
#
# wheel 只作为 Actions artifact，不进 release 资产：release 是给用户装 CLI 的，
# 而 wheel 的消费者是本地测试和 PyPI。人工 publish draft 之后，publish-pypi.yml
# 会回到那次运行的 artifact 里取 wheel 发 PyPI。
# 顺序是刻意的：PyPI 的版本号一旦上传就永久占用，必须有人先看一眼再发。
#
# 手动模式的价值是在打 tag 之前先验证五个平台都编得出来、wheel 打得动。
# 注意 draft release 不出现在 releases/latest 里，所以
# scripts/install.sh 只有在手动 publish 之后才会指向新版本。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # 发布构建宁可排队也不能被中断。
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 与 ci.yml 保持一致：产物要可复现，工具链就不能是移动靶。
  RUST_VERSION: "1.99.0"

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # 手动触发时 ref 通常是分支，没有可比的版本号，跳过。
      # 放在 build 之前独立成 job：版本对不上时一个平台都不编。
      - name: Check tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v${tag} does not match Cargo.toml version ${ver}"
            exit 1
          fi
          echo "version ${ver} ok"

  build:
    name: ${{ matrix.artifact }}
    needs: verify
    strategy:
      # 五个平台都跑完再收工，一次就能看到所有失败原因。
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     artifact: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, artifact: linux-arm64 }
          - { target: aarch64-apple-darwin,      os: macos-latest,     artifact: darwin-arm64 }
          # Intel 版由 arm 设备交叉编译。rustc 会自动给 apple target 传
          # `-arch x86_64`，不需要额外配置 linker。
          - { target: x86_64-apple-darwin,       os: macos-latest,     artifact: darwin-x86_64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2022,     artifact: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 交叉编译到 aarch64 时 cargo 默认仍用宿主机的 cc，装了 gcc 也没用，
      # 必须显式指定 linker，否则链接阶段直接失败。
      - name: Install ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binary
        if: github.event_name == 'push'
        run: cargo build --release --target ${{ matrix.target }}

      # 手动模式下由 maturin 驱动 cargo，避免同一个 target 编译两遍。
      # 它产出的二进制和 cargo build 落在同一目录，下面打包照旧。
      # 两种模式都要 wheel：手动模式供本地验证，tag 模式供 publish-pypi.yml 发 PyPI。
      # tag 模式下 cargo build 已经编过，maturin 会复用产物，不会重编一遍。
      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release --target ${{ matrix.target }} --out dist

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar czf "dist/byk-${{ matrix.artifact }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" byk

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/byk.exe" -DestinationPath "dist/byk-${{ matrix.artifact }}.zip"

      # 二进制和 wheel 分成两个 artifact：手动模式想单独下载某个 .whl 时，
      # 不必先解开一个混装的包。
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: byk-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

      # 中间产物，下面 wheels job 会把它收拢成一个压缩包再删掉。
      # 两种模式都要传：tag 模式下它是 publish-pypi.yml 的唯一输入。
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # 把五个平台的 wheel 收拢成一个压缩包：手动模式方便一次下载完，
  # tag 模式下它是 publish-pypi.yml 发 PyPI 的输入（不进 release 资产）。
  # 每平台的中间 artifact 用完即删。
  wheels:
    name: wheels bundle
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write        # 删除中间 artifact 需要
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        run: echo "VERSION=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          # 五个平台的 whl 平铺到同一目录，打包时不用处理层级。
          merge-multiple: true

      - name: Bundle wheels
        run: |
          cd wheels
          ls -1 ./*.whl
          zip -j "../byk-${VERSION}-wheels.zip" ./*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: byk-wheels
          path: byk-*-wheels.zip
          if-no-files-found: error
          # 7 天够用：正常流程是当天打 tag、当天 publish。超时后 publish-pypi.yml
          # 会明确报错，重跑一次 release.yml 即可补。
          retention-days: 7

      # 清理失败不该把整个 workflow 拖红——产物早就传好了。
      - name: Remove per-platform wheel artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("wheel-")) | .id' |
          while read -r id; do
            echo "deleting artifact ${id}"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
          done

  release:
    name: draft release
    # 等 wheels 收拢完再跑：那时中间 artifact 已被删除，下载目录里只剩
    # 5 个二进制包和 1 个 wheel 包，不会有散落的 .whl 混进来。
    needs: [build, wheels]
    # 手动触发时如果在界面上把 ref 选成了某个 tag，ref_type 同样会是 tag，
    # 所以必须连 event_name 一起判断，否则预发布演练会真的发一个草稿。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # merge-multiple 把所有 artifact 平铺到一个目录，省掉手动搬运。
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # 在 assets 里生成，校验和文件记录的是不带目录前缀的文件名，
      # 用户下载后在同目录 `sha256sum -c checksums.txt` 即可。
      # 只列二进制包：下载目录里还有 byk-<version>-wheels.zip，它不进 release。
      - name: Generate checksums
        run: |
          cd assets
          sha256sum byk-linux-*.tar.gz byk-darwin-*.tar.gz byk-windows-*.zip | tee checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            assets/byk-linux-*.tar.gz
            assets/byk-darwin-*.tar.gz
            assets/byk-windows-*.zip
            assets/checksums.txt
          generate_release_notes: true
